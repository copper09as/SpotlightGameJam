behaviors:
  My Behavior:
    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 8192
      learning_rate: 0.0001
      beta: 0.001
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0
      gail:
        gamma: 0.995
        strength: 0.1
        demo_path: C:/Users/g2294/Desktop/UnityProjects/SpotlightGameJam_Demos/All
        learning_rate: 0.0003
        use_actions: true

    behavioral_cloning:
      demo_path: C:/Users/g2294/Desktop/UnityProjects/SpotlightGameJam_Demos/All
      strength: 50.0
      steps: 100000
      batch_size: 512
      num_epoch: 5
      samples_per_update: 0

    keep_checkpoints: 12
    checkpoint_interval: 10000
    threaded: true
    max_steps: 100000
    time_horizon: 128
    summary_freq: 5000
