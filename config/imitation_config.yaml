behaviors:
  MyBehavior:
    trainer_type: ppo
    
    hyperparameters:
      batch_size: 128
      buffer_size: 2048
      learning_rate: 0.0003
      beta: 0.01
      epsilon: 0.2
      lambd: 0.95
      num_epoch: 3
      learning_rate_schedule: linear
    
    network_settings:
      normalize: false
      hidden_units: 256
      num_layers: 2
    
    max_steps: 200000
    time_horizon: 64
    summary_freq: 2500
    
    behavioral_cloning:
      demo_path: ./Assets/Demonstrations/MyDemo.demo
      strength: 1.0
      steps: 50000
      batch_size: 512
    
    reward_signals:
      extrinsic:
        gamma: 0.99
        strength: 1.0
      gail:
        gamma: 0.99
        strength: 0.01
        demo_path: ./Assets/Demonstrations/MyDemo.demo
        learning_rate: 0.0003
        use_actions: false
        network_settings:
          hidden_units: 128
          num_layers: 2