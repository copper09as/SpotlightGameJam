behaviors:
  My Behavior:
    trainer_type: ppo

    hyperparameters:
      batch_size: 256
      buffer_size: 8192
      learning_rate: 0.0001
      beta: 0.003
      epsilon: 0.15
      lambd: 0.95
      num_epoch: 5
      learning_rate_schedule: linear

    network_settings:
      normalize: true
      hidden_units: 256
      num_layers: 3
      vis_encode_type: simple

    reward_signals:
      extrinsic:
        gamma: 0.995
        strength: 1.0

      curiosity:
        gamma: 0.99
        strength: 0.02
        learning_rate: 0.0003

    behavioral_cloning:
      demo_path: Assets/Demonstrations/TrainJump_12.demo
      strength: 5.0
      steps: 1000000
      batch_size: 512
      num_epoch: 3
      samples_per_update: 0

    keep_checkpoints: 10
    checkpoint_interval: 50000

    threaded: true

    max_steps: 3000000
    time_horizon: 128
    summary_freq: 500